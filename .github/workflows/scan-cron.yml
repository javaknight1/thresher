name: Refresh scan boards

# Precompute each timeframe's board on a schedule so page reads serve warm
# boards (the app reads from Upstash; only this job recomputes). US regular
# hours are ~13:30–20:00 UTC (09:30–16:00 ET), Mon–Fri. Also runnable on demand.
on:
  schedule:
    - cron: '*/30 13-20 * * 1-5'
  workflow_dispatch: {}

# One workflow run at a time; don't pile up if a run is slow.
concurrency:
  group: scan-cron
  cancel-in-progress: false

jobs:
  refresh:
    # One job per (scope, candle size), so each shows its own pass/fail + error
    # body, and one failing never hides the others (fail-fast: false). Equity and
    # crypto boards are keyed separately in the store.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope: [equity, crypto]
        timeframe: [intraday, swing, position]
    name: refresh (${{ matrix.scope }} · ${{ matrix.timeframe }})
    steps:
      - name: Refresh the ${{ matrix.scope }} ${{ matrix.timeframe }} board
        env:
          BASE_URL: https://thresher.sharkfins.xyz
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TF: ${{ matrix.timeframe }}
          SCOPE: ${{ matrix.scope }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set — add it as a repo secret"; exit 1
          fi
          # Equity is the default scope (no param); crypto passes &scope=crypto.
          scope_param=""
          [ "$SCOPE" = "crypto" ] && scope_param="&scope=crypto"
          body=$(mktemp)
          code=000
          # One retry: a cold scan can time out on the first hit.
          for attempt in 1 2; do
            code=$(curl -s -o "$body" -w "%{http_code}" --max-time 150 \
              "$BASE_URL/api/cron/scan?timeframe=$TF$scope_param&key=$CRON_SECRET")
            [ "$code" = "200" ] && break
            echo "attempt $attempt: $SCOPE/$TF -> HTTP $code :: $(cat "$body")"
            [ "$attempt" = "1" ] && sleep 10
          done
          if [ "$code" = "200" ]; then
            echo "✓ $SCOPE/$TF -> HTTP 200 :: $(cat "$body")"
            exit 0
          fi
          # Failure: surface a human-readable reason, not raw JSON. The route
          # returns {reason, message, ...}; prefer message, then error, then raw.
          raw=$(cat "$body")
          reason=$(printf '%s' "$raw" | jq -r '.reason // empty' 2>/dev/null || true)
          msg=$(printf '%s' "$raw" | jq -r '.message // .error // empty' 2>/dev/null || true)
          if [ -z "$msg" ]; then
            # Non-JSON body — the Worker crashed hard before returning structured
            # JSON (e.g. Cloudflare "error code: 1101" = unhandled exception, or a
            # CPU/subrequest hard-kill of the isolate).
            case "$raw" in
              *1101*)
                reason="worker-crash"
                msg="The Worker threw an unhandled exception (Cloudflare error 1101) before returning — most likely a CPU or subrequest hard-kill during the $SCOPE/$TF scan. Reduce the scanned universe or move to Workers Paid." ;;
              *5[0-9][0-9]*|"")
                reason="edge-error"
                msg="No structured error body (HTTP $code). The request failed at the edge before the Worker could respond." ;;
              *)
                msg="$raw" ;;
            esac
          fi
          title="cron $SCOPE/$TF failed (HTTP $code${reason:+, $reason})"
          echo "::error title=$title::$msg"
          # Also echo to the step log so it's visible without opening annotations.
          echo "✗ $title :: $msg"
          exit 1
