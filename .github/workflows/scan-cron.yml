name: Refresh scan boards

# Precompute the Top-board scans on a schedule so page reads serve warm boards
# (the app reads from Upstash; only this job recomputes). US regular hours are
# ~13:30–20:00 UTC (09:30–16:00 ET), Mon–Fri. Also runnable on demand.
on:
  schedule:
    - cron: '*/30 13-20 * * 1-5'
  workflow_dispatch: {}

# Don't pile up runs if one is slow.
concurrency:
  group: scan-cron
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Recompute each timeframe board
        env:
          BASE_URL: https://thresher.sharkfins.xyz
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set — add it as a repo secret"; exit 1; fi
          fail=0
          for tf in intraday swing position; do
            # Capture the response body AND the status so a failure shows the cause,
            # not just the HTTP code. The endpoint returns JSON { ok, stage, error, hint }.
            body=$(mktemp)
            code=$(curl -s -o "$body" -w "%{http_code}" --max-time 120 \
              "$BASE_URL/api/cron/scan?timeframe=$tf&key=$CRON_SECRET")
            if [ "$code" = "200" ]; then
              echo "✓ $tf -> HTTP 200 :: $(cat "$body")"
            else
              echo "::error title=cron $tf failed (HTTP $code)::$(cat "$body")"
              echo "✗ $tf -> HTTP $code :: $(cat "$body")"
              fail=1
            fi
            rm -f "$body"
          done
          exit $fail
