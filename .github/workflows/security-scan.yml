name: Security scan

# Weekly CVE backstop: re-runs `pnpm audit` on a schedule so advisories that
# drop during quiet periods (no pushes to master) still surface within ~7 days.
# Dependabot security updates cover most module CVEs by opening a PR
# automatically; this catches the rest and gives a single weekly signal.
# Fails only on high/critical so low/moderate noise doesn't cry wolf.

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC (~7am PT), before Dependabot's batch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads packageManager from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Gate on the SHIPPED surface: production deps at high/critical. Dev-only
      # toolchain (wrangler/miniflare/esbuild/opennext) drags in many transitive
      # advisories that never reach the deployed app, so gating on those would
      # just cry wolf.
      - name: pnpm audit — production, high+
        run: pnpm audit --prod --audit-level=high
      # Informational: the full picture (dev deps included), never fails.
      - name: pnpm audit — full (informational)
        if: always()
        run: pnpm audit || true
