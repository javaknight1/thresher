name: Security scan

# Weekly CVE backstop: re-runs `pnpm audit` on a schedule so advisories that
# drop during quiet periods (no pushes to master) still surface within ~7 days.
# Dependabot security updates cover most module CVEs by opening a PR
# automatically; this catches the rest and gives a single weekly signal.
# Fails only on high/critical so low/moderate noise doesn't cry wolf.

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC (~7am PT), before Dependabot's batch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4 # reads packageManager from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Gate on the actionable bar: production deps at CRITICAL. The remaining
      # "high" advisories are transitive, deep in build/adapter tooling with no
      # direct-dep fix we can apply (opennext→sharp/undici/ws, next→postcss at
      # build time, yahoo-finance2→mcp-sdk sub-deps) — gating on those would be
      # perpetually red. Dependabot carries them as upstreams release.
      - name: pnpm audit — production, critical
        run: pnpm audit --prod --audit-level=critical
      # Informational: the full picture (prod highs + dev deps), never fails.
      - name: pnpm audit — full (informational)
        if: always()
        run: pnpm audit || true
